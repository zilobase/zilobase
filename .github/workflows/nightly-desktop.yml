name: Nightly desktop matrix

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: mac-x64
            os: macos-15-intel
          - name: mac-arm64
            os: macos-15
          - name: windows-x64
            os: windows-2022
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ZILOBASE_REQUIRE_SIGNING: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/electron/sidecar -> target
      - name: Install Linux packaging and audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev pkg-config rpm
      - run: npm ci
      - run: node scripts/desktop/verify-electron-candidate.mjs preflight
      - run: npm run build --workspace @zilobase/desktop
      - run: node scripts/desktop/verify-electron-candidate.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: zilobase-nightly-${{ matrix.name }}
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.pkg
            apps/desktop/dist-electron/*-mac.zip
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.msi
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/*.rpm
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/latest*.yml
          if-no-files-found: error
          retention-days: 7
