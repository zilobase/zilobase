name: Fallow

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  audit:
    name: Audit changed code
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate newly introduced findings
        if: github.event_name == 'pull_request'
        run: npm run quality:fallow -- --format github-annotations

      - name: Report complete production health
        if: github.event_name != 'pull_request'
        run: npm run quality:fallow:full -- --type-aware --format github-annotations
