name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example, v0.0.6)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  desktop-signing-preflight:
    runs-on: ubuntu-24.04
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Require all desktop signing credentials before publishing anything
        shell: bash
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_INSTALLER_CERTIFICATE APPLE_INSTALLER_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository signing secret: $name"
              missing=1
            fi
          done
          exit "$missing"

  image:
    name: Image (${{ matrix.arch }})
    needs: desktop-signing-preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set image variables
        id: vars
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.vars.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        shell: bash
        run: |
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set release variables
        id: vars
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [[ "$version" != *-* ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish multi-platform image
        shell: bash
        run: |
          image="${{ steps.vars.outputs.image }}"
          tag="${{ steps.vars.outputs.tag }}"
          tags=(--tag "$image:$tag")
          if [[ "${{ steps.vars.outputs.latest }}" == "true" ]]; then
            tags+=(--tag "$image:latest")
          fi

          sources=()
          for digest_file in "$RUNNER_TEMP"/digests/*; do
            sources+=("$image@sha256:$(basename "$digest_file")")
          done
          if [[ "${#sources[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#sources[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$image:$tag"

      - name: Extract changelog notes
        id: notes
        shell: bash
        run: |
          awk -v version="${{ steps.vars.outputs.version }}" '
            $0 == "## " version { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Zilobase ${{ steps.vars.outputs.tag }}" > release-notes.md
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Community Helm chart
        run: >-
          helm package deploy/helm/zilobase
          --destination dist
          --version "${{ steps.vars.outputs.version }}"
          --app-version "${{ steps.vars.outputs.version }}"

      - name: Prepare draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.vars.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Refusing to replace assets on an already published release: $tag" >&2
              exit 1
            fi
            gh release edit "$tag" --title "Zilobase $tag" --notes-file release-notes.md
          else
            gh release create "$tag" --draft --title "Zilobase $tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" dist/zilobase-*.tgz --clobber

  desktop-electron-build:
    needs: release
    name: Electron desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-x64
            os: macos-15-intel
          - name: mac-arm64
            os: macos-15
          - name: windows-x64
            os: windows-2022
          - name: linux-x64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ZILOBASE_REQUIRE_SIGNING: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_LINK: ${{ startsWith(matrix.name, 'mac-') && secrets.APPLE_CERTIFICATE || '' }}
      CSC_KEY_PASSWORD: ${{ startsWith(matrix.name, 'mac-') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      CSC_INSTALLER_LINK: ${{ startsWith(matrix.name, 'mac-') && secrets.APPLE_INSTALLER_CERTIFICATE || '' }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ startsWith(matrix.name, 'mac-') && secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD || '' }}
      APPLE_ID: ${{ startsWith(matrix.name, 'mac-') && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(matrix.name, 'mac-') && secrets.APPLE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ startsWith(matrix.name, 'mac-') && secrets.APPLE_TEAM_ID || '' }}
      WIN_CSC_LINK: ${{ matrix.name == 'windows-x64' && secrets.WINDOWS_CERTIFICATE || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ matrix.name == 'windows-x64' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/electron/sidecar -> target
      - name: Install Linux packaging and audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev pkg-config rpm
      - run: npm ci
      - run: node scripts/desktop/verify-electron-candidate.mjs preflight
      - run: npm run build --workspace @zilobase/desktop
      - run: node scripts/desktop/verify-electron-candidate.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: electron-release-${{ matrix.name }}
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.pkg
            apps/desktop/dist-electron/*-mac.zip
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/*.msi
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/*.rpm
            apps/desktop/dist-electron/*.blockmap
            apps/desktop/dist-electron/latest*.yml
          if-no-files-found: error
          retention-days: 7

  desktop-electron-publish:
    needs: [release, desktop-electron-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: electron-release-*
          path: ${{ runner.temp }}/electron-candidates
      - name: Assemble platform update feeds
        shell: bash
        run: node scripts/desktop/assemble-electron-release.mjs "$RUNNER_TEMP/electron-candidates" "$RUNNER_TEMP/electron-release"
      - name: Preserve installed Tauri clients' last signed update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release download v0.0.55 -p latest.json -D "$RUNNER_TEMP/electron-release"
          node -e 'const f=require("fs");const feed=JSON.parse(f.readFileSync(process.argv[1],"utf8"));if(feed.version!=="0.0.55")process.exit(1)' "$RUNNER_TEMP/electron-release/latest.json"
      - name: Publish Electron installers and update feeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=("$RUNNER_TEMP"/electron-release/*)
          test "${#assets[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
