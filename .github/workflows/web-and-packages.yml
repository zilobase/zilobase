name: Web and packages

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/colors/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-and-packages.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/colors/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-and-packages.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:packages
      - run: npm run test:web
      - run: npm run build:web
