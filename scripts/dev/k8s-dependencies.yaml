apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17.10-alpine
          env:
            - { name: POSTGRES_DB, value: zilobase }
            - { name: POSTGRES_USER, value: zilobase }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: zilobase-dev-infra, key: POSTGRES_PASSWORD } }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U zilobase -d zilobase"] }
            periodSeconds: 3
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: __NAMESPACE__ }
spec:
  selector: { app: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data, namespace: __NAMESPACE__ }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: __NAMESPACE__ }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: zilobase }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: zilobase-dev-infra, key: MINIO_ROOT_PASSWORD } }
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/live, port: api }
            periodSeconds: 3
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: __NAMESPACE__ }
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: api }
    - { name: console, port: 9001, targetPort: console }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: minio-data, namespace: __NAMESPACE__ }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: minio-init, namespace: __NAMESPACE__ }
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          env:
            - { name: MINIO_ROOT_USER, value: zilobase }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: zilobase-dev-infra, key: MINIO_ROOT_PASSWORD } }
          command: ["/bin/sh", "-c"]
          args:
            - >-
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done;
              mc mb --ignore-existing local/zilobase;
              mc anonymous set none local/zilobase
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mailpit, namespace: __NAMESPACE__ }
spec:
  replicas: 1
  selector: { matchLabels: { app: mailpit } }
  template:
    metadata: { labels: { app: mailpit } }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27.8
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: web, containerPort: 8025 }
          readinessProbe:
            httpGet: { path: /readyz, port: web }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: { name: mailpit, namespace: __NAMESPACE__ }
spec:
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: web, port: 8025, targetPort: web }
