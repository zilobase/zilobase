{{- if and (gt (int .Values.replicaCount) 1) (not .Values.realtime.enabled) }}{{ fail "realtime.enabled must be true when replicaCount is greater than one" }}{{ end }}
{{- if and .Values.realtime.enabled (eq .Values.realtime.existingSecret "") }}{{ fail "realtime.existingSecret is required when realtime.enabled is true" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zilobase.fullname" . }}
  labels:
    {{- include "zilobase.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if gt (int .Values.replicaCount) 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 1 }
  {{- else }}
  strategy: { type: Recreate }
  {{- end }}
  selector:
    matchLabels:
      {{- include "zilobase.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zilobase.selectorLabels" . | nindent 8 }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: {{ include "zilobase.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: zilobase
          image: {{ include "zilobase.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          env:
            {{- include "zilobase.env" . | nindent 12 }}
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 10"] }
          ports:
            - { name: http, containerPort: 3000, protocol: TCP }
            {{ if .Values.debug.enabled }}
            - { name: inspector, containerPort: {{ .Values.debug.port }}, protocol: TCP }
            {{ end }}
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.trustedCa.configMapName }}
            - { name: trusted-ca, mountPath: /etc/zilobase/trusted-ca, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
        {{- if .Values.trustedCa.configMapName }}
        - name: trusted-ca
          configMap:
            name: {{ .Values.trustedCa.configMapName | quote }}
            items:
              - { key: {{ .Values.trustedCa.key | quote }}, path: ca.crt }
        {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
