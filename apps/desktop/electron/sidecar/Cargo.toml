[package]
name = "zilobase-desktop-sidecar"
version = "0.0.55"
edition = "2021"

[dependencies]
cpal = "0.18.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
