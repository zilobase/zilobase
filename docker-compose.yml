name: zilobase

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      zilobase:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ZILOBASE_SITE_ADDRESS: ${ZILOBASE_SITE_ADDRESS:?Set ZILOBASE_SITE_ADDRESS to the application domain}
      ZILOBASE_STORAGE_SITE_ADDRESS: ${ZILOBASE_STORAGE_SITE_ADDRESS:?Set ZILOBASE_STORAGE_SITE_ADDRESS to the object-storage domain}
    ports:
      - "${ZILOBASE_HTTP_PORT:-80}:80"
      - "${ZILOBASE_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 5

  zilobase:
    image: ${ZILOBASE_IMAGE:?Set ZILOBASE_IMAGE to an immutable release tag or digest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET to at least 32 random characters}
      ZILOBASE_BOOTSTRAP_TOKEN: ${ZILOBASE_BOOTSTRAP_TOKEN:?Set ZILOBASE_BOOTSTRAP_TOKEN to at least 32 random characters}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL to the public application origin}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL to the public application origin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GMAIL_GOOGLE_CLIENT_ID: ${GMAIL_GOOGLE_CLIENT_ID:-}
      GMAIL_GOOGLE_CLIENT_SECRET: ${GMAIL_GOOGLE_CLIENT_SECRET:-}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY:-}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      GMAIL_PUBSUB_PUSH_AUDIENCE: ${GMAIL_PUBSUB_PUSH_AUDIENCE:-}
      GMAIL_PUBSUB_SERVICE_ACCOUNT_EMAIL: ${GMAIL_PUBSUB_SERVICE_ACCOUNT_EMAIL:-}
      GMAIL_PUBSUB_SUBSCRIPTION: ${GMAIL_PUBSUB_SUBSCRIPTION:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:-}
      IMAGE_STORAGE_MODE: s3
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT to the public object-storage origin}
      S3_BUCKET_NAME: ${MINIO_BUCKET:?Set MINIO_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_AGENT_MAX_CONCURRENT_TURNS_PER_USER: ${AI_AGENT_MAX_CONCURRENT_TURNS_PER_USER:-}
      AI_AGENT_MAX_CONCURRENT_TURNS_PER_WORKSPACE: ${AI_AGENT_MAX_CONCURRENT_TURNS_PER_WORKSPACE:-}
      AI_AGENT_MAX_TURNS_PER_USER_PER_DAY: ${AI_AGENT_MAX_TURNS_PER_USER_PER_DAY:-}
      AI_AGENT_MAX_TOKENS_PER_USER_PER_DAY: ${AI_AGENT_MAX_TOKENS_PER_USER_PER_DAY:-}
      AI_AGENT_MAX_UPLOAD_BYTES_PER_USER_PER_DAY: ${AI_AGENT_MAX_UPLOAD_BYTES_PER_USER_PER_DAY:-}
      AI_AGENT_MAX_ARTIFACTS_PER_USER_PER_DAY: ${AI_AGENT_MAX_ARTIFACTS_PER_USER_PER_DAY:-}
      AI_AGENT_MAX_ARTIFACT_BYTES_PER_USER_PER_DAY: ${AI_AGENT_MAX_ARTIFACT_BYTES_PER_USER_PER_DAY:-}
      AI_AGENT_MAX_FILES_PER_TURN: ${AI_AGENT_MAX_FILES_PER_TURN:-}
      AI_AGENT_MAX_INPUT_MESSAGES: ${AI_AGENT_MAX_INPUT_MESSAGES:-}
      AI_AGENT_MAX_INPUT_CHARACTERS: ${AI_AGENT_MAX_INPUT_CHARACTERS:-}
      AI_AGENT_MAX_STEPS: ${AI_AGENT_MAX_STEPS:-}
      AI_AGENT_MAX_OUTPUT_TOKENS: ${AI_AGENT_MAX_OUTPUT_TOKENS:-}
      AI_AGENT_MAX_PROVIDER_RETRIES: ${AI_AGENT_MAX_PROVIDER_RETRIES:-}
      AI_AGENT_TURN_TIMEOUT_MS: ${AI_AGENT_TURN_TIMEOUT_MS:-}
      AI_AGENT_STREAM_STEP_TIMEOUT_MS: ${AI_AGENT_STREAM_STEP_TIMEOUT_MS:-}
      AI_AGENT_STREAM_CHUNK_TIMEOUT_MS: ${AI_AGENT_STREAM_CHUNK_TIMEOUT_MS:-}
      AI_AGENT_AUDIT_RETENTION_DAYS: ${AI_AGENT_AUDIT_RETENTION_DAYS:-}
      AI_AGENT_CLEANUP_BATCH_SIZE: ${AI_AGENT_CLEANUP_BATCH_SIZE:-}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM to the production sender identity}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST to the production mail server}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:?Set SMTP_SECURE to true or false}
      SMTP_USER: ${SMTP_USER:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        attempts=0
        until mc alias set zilobase http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 20 ]; then
            echo "MinIO did not accept authenticated requests after 20 attempts" >&2
            exit 1
          fi
          sleep 2
        done
        mc mb --ignore-existing "zilobase/$$MINIO_BUCKET"
        mc anonymous set none "zilobase/$$MINIO_BUCKET"

  valkey:
    image: valkey/valkey:8-alpine
    profiles: ["ha"]
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  minio_data:
